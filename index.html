<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Mascot/Logo Library | Richardson ISD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN TOKENS
   The homepage stays neutral so 50 campus palettes can shine.
   Campus pages set --campus to that campus's first color.
   ========================================================= */
:root {
  --ink: #1b2230;
  --ink-2: #4c5563;
  --ink-3: #7a8290;
  --line: #dde1e7;
  --surface: #f4f5f7;
  --paper: #ffffff;
  --risd-blue: #1b3668;
  --risd-red: #ac1f2d;
  --accent: #1b3668;
  --dont: #b42318;
  --do: #16794a;
  --campus: #1b3668;
  --radius-lg: 18px;
  --radius-sm: 8px;
  --wrap: 1120px;
  font-family: "Public Sans", "Segoe UI", Arial, sans-serif;
  color: var(--ink);
  background: var(--paper);
}
* { box-sizing: border-box; }
body { margin: 0; line-height: 1.55; font-size: 17px; }
img { max-width: 100%; display: block; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }
h1, h2, h3 { line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Top bar ---------- */
.topbar { border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 10; }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 800; color: var(--ink); text-decoration: none; font-size: 17px; }
.brand img { width: 44px; height: 44px; }
.brand span { font-weight: 500; color: var(--ink-2); }
.topbar nav a { color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 15px; margin-left: 20px; }
.topbar nav a:hover { color: var(--ink); }
.topbar nav a.cta { background: var(--risd-red); color: #fff; padding: 9px 18px; border-radius: 999px; font-weight: 700; }
.topbar nav a.cta:hover { background: #8e1824; color: #fff; }

/* ---------- Homepage intro ---------- */
/* Intro + RISD panel. Three type sizes only:
   --t-lg heading, --t-md reading text, --t-sm labels and controls */
.intro { --t-lg: clamp(32px, 4vw, 48px); --t-md: 19px; --t-sm: 14px; padding: 64px 0 56px; }
.intro .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: start; }
.intro h1 { font-size: var(--t-lg); font-weight: 800; }
.intro .lede { margin-top: 18px; font-size: var(--t-md); font-weight: 600; color: var(--ink); }
.intro .body { font-size: var(--t-md); color: var(--ink-2); }
.intro p + p { margin-top: 14px; }

.district { border: 1.5px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; background: var(--paper); font-size: var(--t-sm); }
.district .part { padding: 20px 22px; }
.district .part + .part { border-top: 1px solid var(--line); }
.district .dl-head { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
.district .dl-head img { width: 60px; height: 60px; flex: none; }
.district .dl-head h2 { font-size: var(--t-md); font-weight: 800; }
.district .dl-table { font-size: var(--t-sm); }
.district .dl-table td { width: 62%; }
.district .fmts { display: flex; gap: 6px; justify-content: flex-end; }
.district .fmt { flex: 0 0 calc((100% - 12px) / 3); text-align: center; font-size: var(--t-sm); padding: 6px 0; }

.file-note { margin-top: 14px; padding: 12px 14px; background: var(--surface); border-radius: var(--radius-sm); font-style: italic; color: var(--ink-3); }
.file-note h3 { font-size: var(--t-sm); font-weight: 700; margin-bottom: 2px; color: var(--ink-2) !important; }
.file-note strong { font-weight: 700; color: var(--ink-2); }

.district .all-logos { margin-top: 14px; font-size: var(--t-sm); }
.district .all-logos .btn { font-size: var(--t-sm); padding: 9px 16px; background: var(--surface); border-color: var(--line); color: var(--ink); }
.district .all-logos .btn:hover { background: var(--line); border-color: var(--line); color: var(--ink); }
.district .all-logos .muted { font-size: var(--t-sm); }

.mini-colors { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 520px) { .mini-colors { grid-template-columns: 1fr; } }
.mini-color .sw { height: 56px; border-radius: 10px; display: flex; align-items: flex-end; padding: 10px 14px; margin-bottom: 8px;
  color: #fff; font-weight: 700; font-size: var(--t-sm); }
.mini-color .codes { gap: 5px; }
.district .code, .district .code .k, .district .code .v, .district .code .hint { font-size: var(--t-sm); }
.district .code { padding: 6px 12px; }
.code.compact { font-size: 13px; padding: 5px 9px; gap: 8px; }
.code.compact .k { font-size: 12px; min-width: 50px; }

.btn {
  font: inherit; font-weight: 700; font-size: 15px; padding: 12px 20px; border-radius: 999px;
  border: 1.5px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
}
.btn.ghost { background: transparent; color: var(--ink); }
.btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
input[type="search"] {
  font: inherit; font-size: 17px; padding: 12px 16px; border: 1.5px solid var(--line);
  border-radius: 999px; background: var(--paper); color: var(--ink); min-width: 0;
}
input[type="search"]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(27,54,104,.18); }

/* ---------- Sections ---------- */
section.block { padding: 56px 0; border-top: 1px solid var(--line); }
.block-head { display: grid; gap: 8px; margin-bottom: 32px; max-width: 64ch; }
.block-head h2 { font-size: 30px; font-weight: 800; }

/* Keep the logo intact: visual gallery + full rule list */
.misuse { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
.misuse figure { margin: 0; }
.misuse .stage {
  aspect-ratio: 1; border-radius: 12px; background: var(--surface); display: grid; place-items: center;
  overflow: hidden; border: 2px solid transparent;
}
.misuse .stage > * { width: 62%; height: auto; }
.misuse .stage > .initials { font-size: 22px; }
.misuse figcaption { font-size: 14px; margin-top: 8px; font-weight: 600; display: flex; gap: 6px; align-items: baseline; }
.misuse .mark { font-weight: 800; }
.misuse .is-dont .mark { color: var(--dont); }
.misuse .is-do .mark { color: var(--do); }
.demo-recolor > * { filter: hue-rotate(115deg) saturate(1.6); }
.demo-rotate > * { transform: rotate(-22deg); }
.demo-stretch > * { transform: scaleX(1.4) scaleY(.8); }
.demo-shadow > * { filter: drop-shadow(8px 10px 6px rgba(0,0,0,.55)); }
.demo-busy { background: repeating-linear-gradient(45deg, #f59e0b 0 14px, #7c3aed 14px 28px, #10b981 28px 42px) !important; }
.rule-list { margin: 32px 0 0; padding: 24px 28px; list-style: none; columns: 3; column-gap: 32px;
  border: 1.5px solid var(--line); border-radius: var(--radius-lg); }
.rule-list li { break-inside: avoid; padding: 6px 0 6px 22px; position: relative; font-size: 15px; }
.rule-list li::before { content: "✕"; position: absolute; left: 0; color: var(--dont); font-weight: 800; }

/* File type helper */
.filetypes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.filetype { border: 1.5px solid var(--line); border-radius: var(--radius-lg); padding: 22px 24px; }
.filetype .ext { font-weight: 800; font-size: 26px; }
.filetype .use { font-weight: 700; margin-top: 4px; }
.filetype p { font-size: 15px; color: var(--ink-2); margin-top: 8px; }

/* ---------- Campus directory ---------- */
.dir-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 28px; }
.dir-controls input { width: min(360px, 100%); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 15px; font-weight: 600; padding: 9px 16px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink-2); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.tile {
  display: flex; flex-direction: column; align-items: center; gap: 12px; text-decoration: none; color: var(--ink);
  padding: 22px 14px 18px; border-radius: var(--radius-lg); background: var(--surface); text-align: center;
  border: 2px solid transparent; transition: border-color .15s, background .15s;
}
.tile:hover { background: var(--paper); border-color: var(--tile-color, var(--ink)); }
.tile .logo { width: 116px; height: 116px; display: grid; place-items: center; }
.tile .logo img { width: 100%; height: 100%; object-fit: contain; }
.tile .name { font-weight: 700; font-size: 15px; line-height: 1.25; }
.initials {
  width: 100%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-weight: 800;
  font-size: 30px; color: var(--ink-3); background: var(--paper); border: 2px dashed var(--line);
}
.empty { padding: 40px; text-align: center; background: var(--surface); border-radius: var(--radius-lg); }
.empty p + p { margin-top: 12px; }

/* ---------- Campus page ---------- */
.campus-hero {
  background: color-mix(in srgb, var(--campus) 14%, white);
  border-bottom: 6px solid var(--campus);
  padding: 28px 0 40px;
}
.back { display: inline-flex; gap: 6px; font-weight: 600; font-size: 15px; color: var(--ink-2); text-decoration: none; }
.back:hover { color: var(--ink); }
.campus-hero .row { display: flex; gap: 36px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
.campus-hero .logo { width: 180px; height: 180px; flex: none; display: grid; place-items: center; }
.campus-hero .logo img { width: 100%; height: 100%; object-fit: contain; }
.campus-hero h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 800; }
.campus-hero .meta { margin-top: 10px; color: var(--ink-2); font-size: 18px; font-weight: 500; }
.campus-hero .note { margin-top: 14px; background: var(--paper); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 15px; max-width: 60ch; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.jump a { font-size: 14px; font-weight: 600; color: var(--ink); background: var(--paper); padding: 7px 14px; border-radius: 999px; text-decoration: none; }
.jump a:hover { background: var(--ink); color: #fff; }

/* Logos: one card per logo version, as many as the campus has */
.logo-dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
.logo-group + .logo-group { margin-top: 44px; }
.group-title { font-size: 30px; font-weight: 800; margin-bottom: 20px; }
.logo-group + .logo-group { margin-top: 56px; }

/* When to use which logo (campuses with magnet logos) */
.guide { margin: 32px 0 0; }
.guide > p { color: var(--ink-2); max-width: 70ch; }
.guide-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; }
.guide-card { background: color-mix(in srgb, var(--campus) 10%, white); border-top: 5px solid var(--campus); border-radius: var(--radius-lg); padding: 22px 24px; }
.guide-card h3 { font-size: 21px; font-weight: 800; }
.guide-card .lead { font-weight: 700; margin-top: 8px; }
.guide-card ul { margin: 10px 0 0; padding-left: 20px; }
.guide-card li { margin-bottom: 4px; }
.guide .never { margin-top: 18px; color: var(--ink-2); max-width: 80ch; }
.guide .never strong { color: var(--ink); }
@media (max-width: 860px) { .guide-cols { grid-template-columns: 1fr; } }
.dl-card { border: 1.5px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; }
.dl-card .stage { background: var(--surface); height: 180px; display: grid; place-items: center; padding: 24px; }
.dl-card .stage img { max-height: 132px; width: auto; }
/* A version that only has a white PNG is previewed on a dark background so it's visible */
.dl-card .stage.dark { background: #1b2230; }
.dl-card .stage .initials { width: 120px; }
.dl-card .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.dl-card h3 { font-size: 19px; font-weight: 700; }
.dl-card .desc { font-size: 15px; color: var(--ink-2); }
.dl-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: auto; }
.dl-table th { text-align: left; font-weight: 600; color: var(--ink-2); padding: 7px 0; }
.dl-table td { padding: 7px 0 7px 6px; text-align: right; white-space: nowrap; }
.dl-table tr + tr { border-top: 1px solid var(--line); }
.fmt {
  display: inline-block; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 6px;
  border: 1.5px solid var(--line); color: var(--ink); text-decoration: none;
}
.fmt:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
.dl-table .fmt { min-width: 48px; text-align: center; }
.swatch-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; border: 1px solid var(--line); }
.all-logos { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* Colors */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.swatch { border: 1.5px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.swatch .chipcolor { height: 120px; }
.swatch .info { padding: 16px 18px 18px; }
.swatch h3 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
.codes { display: grid; gap: 6px; }
.code {
  font: inherit; font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  width: 100%; background: var(--surface); border: 1.5px solid transparent; border-radius: var(--radius-sm);
  padding: 8px 12px; cursor: pointer; text-align: left; color: var(--ink);
}
.code:hover { border-color: var(--ink); background: var(--paper); }
.code .k { font-weight: 700; font-size: 13px; color: var(--ink-2); min-width: 64px; }
.code .v { flex: 1; }
.code .hint { font-size: 13px; color: var(--ink-3); }
.code:hover .hint { color: var(--ink); }

/* Fonts */
.fonts { display: grid; gap: 14px; }
.font-row {
  display: grid; grid-template-columns: 200px 1fr auto; gap: 24px; align-items: center;
  border: 1.5px solid var(--line); border-radius: var(--radius-lg); padding: 20px 24px;
}
.font-row .role { font-weight: 700; }
.font-row .role small { display: block; font-weight: 400; color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.font-row .sample { font-size: 30px; line-height: 1.2; overflow-wrap: anywhere; }
.font-row .sample small { display: block; font-family: "Public Sans", sans-serif; font-weight: 400; font-size: 14px; color: var(--ink-2); margin-top: 4px; }

/* Templates */
.templates { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.tpl { border: 1.5px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; }
.tpl .preview { aspect-ratio: 16 / 10; background: var(--surface); border-bottom: 1.5px solid var(--line); overflow: hidden; }
.tpl .preview img { width: 100%; height: 100%; object-fit: contain; padding: 12px; }
.tpl .preview.none { display: grid; place-items: center; color: var(--ink-3); font-weight: 700; font-size: 15px; }
.tpl .body { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.tpl .tool { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.tpl h3 { font-size: 19px; font-weight: 700; }
.tpl p { font-size: 15px; color: var(--ink-2); }
.tpl .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
.tpl .btn { font-size: 14px; padding: 9px 16px; }
.tpl.soon { background: var(--surface); border-style: dashed; }
.tpl.soon .preview { display: none; }
.margins { font-size: 14px; background: var(--surface); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--ink); }

.help { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap;
  background: var(--surface); border-radius: var(--radius-lg); padding: 26px 28px; }
.help h3 { font-size: 20px; font-weight: 800; }
.help p { color: var(--ink-2); margin-top: 4px; }

.home h1, .home h2, .home h3, .home .filetype .ext { color: var(--risd-blue); }
.home .dir h2 { color: #fff; }

/* Directory sits on RISD blue so it reads as its own destination */
section.block.dir { background: var(--risd-blue); color: #fff; border-top: none; padding: 64px 0 72px; }
.dir .block-head .muted { color: rgba(255,255,255,.82); }
.dir input[type="search"] { border-color: transparent; }
.dir input[type="search"]:focus { box-shadow: 0 0 0 3px rgba(255,255,255,.45); }
.dir .chip { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
.dir .chip:hover { border-color: #fff; }
.dir .chip[aria-pressed="true"] { background: #fff; color: var(--risd-blue); border-color: #fff; }
.dir :focus-visible { outline-color: #fff; }
.dir .empty { color: var(--ink); }
footer { padding: 28px 0 40px; font-size: 14px; color: var(--ink-3); }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0;
  background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 15px;
  transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.data-notice { background: #fff5d6; color: #5c4400; font-size: 14px; padding: 10px 24px; text-align: center; }
.loading { padding: 80px 0; text-align: center; color: var(--ink-2); }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .intro .cols { grid-template-columns: 1fr; gap: 28px; }
  .filetypes { grid-template-columns: 1fr; }
  .misuse { grid-template-columns: repeat(3, 1fr); }
  .rule-list { columns: 2; }
  .font-row { grid-template-columns: 1fr; gap: 10px; }
  .topbar nav a:not(.cta) { display: none; }
}
@media (max-width: 520px) {
  body { font-size: 16px; }
  .brand { font-size: 15px; }
  .brand span { display: block; }
  .misuse { grid-template-columns: repeat(2, 1fr); }
  .rule-list { columns: 1; }
  .grid { grid-template-columns: repeat(2, 1fr); }
  .tile .logo { width: 96px; height: 96px; }
  .campus-hero .logo { width: 130px; height: 130px; }
  .logo-dl { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- Print: a campus page becomes a clean one-pager ---------- */
@media print {
  .topbar, .back, .jump, .dir-controls, .help .btn, .all-logos, .toast, footer, .code .hint, .tpl .actions { display: none !important; }
  body { font-size: 12pt; }
  section.block { padding: 18pt 0; break-inside: avoid; }
  .campus-hero, .swatch .chipcolor, .demo-busy { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .swatch .chipcolor { height: 60pt; }
  .fmt { border: none; padding: 0; background: none; color: var(--ink); }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#" aria-label="Campus Mascot/Logo Library home">
      <img src="images/logos/risd/risd-primary-full-color.png" alt="">
      <div>Richardson ISD <span>Campus Mascot/Logo Library</span></div>
    </a>
    <nav aria-label="Main">
      <a href="#guidelines">RISD Guidelines</a>
      <a class="cta" href="#directory">Find Your Campus</a>
    </nav>
  </div>
</header>

<main id="app"><div class="loading">Loading campuses…</div></main>

<footer>
  <div class="wrap">Questions about district branding? Email district graphic designer <a href="#" data-contact>Kristin Odom</a>.</div>
</footer>

<div class="toast" role="status" aria-live="polite"></div>

<script src="images/logos/manifest.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* =========================================================
   CONFIG
   Leave SHEET_ID blank to use the SAMPLE data below.
   To use your Google Sheet: share it as "Anyone with the link
   can view", then paste its ID and each tab's GID here.
   ========================================================= */
const CONFIG = {
  SHEET_ID: '11LSL06rnQZIaVyBb3E2LdWDkpjYAP4USYSD01wJKp7I',   // "RISD Brand Library" Google Sheet
  CAMPUS_GID: '436706740',
  LOGOS_GID: '1229210911',               // optional "Logos" tab (see below)
  TEMPLATES_GID: '1188176969',           // optional "Templates" tab: wording on the template cards
  LOGO_BASE: 'images/logos/',            // logos/<slug>/<slug>-<type>-<variant>.<ext>
  TEMPLATE_PREVIEW_BASE: 'images/templates/', // templates/<slug>-<template>.png
  DISTRICT_LOGO: 'images/logos/risd/risd-primary-full-color.png',
  CONTACT_EMAIL: 'kristin.odom@risd.org',
  CONTACT_NAME: 'Kristin Odom, Senior Graphic Designer',
  SE_EMAIL: 'kristin.odom@risd.org',    // "Email Strategy and Engagement" button on campus pages
  // Directory filters. A campus's "level" cell is matched to a pill by these keywords;
  // anything that doesn't match lands in Other.

     slug     → blank for every campus, or one campus's slug for just that campus
     button   → label on the main button; note → small gray box (letterhead margins)

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
async function fetchTab(gid) {
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/export?format=csv&gid=${gid}`;
  let res;
  try { res = await fetch(url); } catch { throw new Error('The browser couldn’t reach Google Sheets (offline, or blocked because the page was opened straight from the hard drive).'); }
  if (!res.ok) throw new Error(`Google Sheets answered with error ${res.status} for tab ${gid}.`);
  const text = await res.text();
  if (/^\s*<(!doctype|html)/i.test(text)) throw new Error('Google Sheets sent a sign-in page instead of data. The sheet may no longer be shared as “Anyone with the link.”');
  const [header, ...rows] = parseCSV(text);
  if (!header) return [];
  const keys = header.map(h => h.trim().toLowerCase());
  return rows.map(r => Object.fromEntries(keys.map((k, i) => [k, (r[i] || '').trim()])));
}
// If the sheet can't be reached, the site still works from the copy of the campus data
// saved in this file, and shows a small notice so you know it isn't live.
let dataNotice = '';
async function loadData() {
  if (!CONFIG.SHEET_ID) return [SAMPLE_CAMPUSES, SAMPLE_LOGOS];
  const [c, l, t] = await Promise.allSettled([
    fetchTab(CONFIG.CAMPUS_GID),
    CONFIG.LOGOS_GID ? fetchTab(CONFIG.LOGOS_GID) : Promise.resolve([]),
    CONFIG.TEMPLATES_GID ? fetchTab(CONFIG.TEMPLATES_GID) : Promise.resolve([])
  ]);
  tplRows = t.status === 'fulfilled' ? t.value.filter(x => x.template) : [];
  if (t.status === 'rejected') console.warn('Templates tab didn’t load:', t.reason.message);
  const logos = l.status === 'fulfilled' ? l.value.filter(x => x.slug && x.type) : [];
  if (l.status === 'rejected') console.warn('Logos tab didn’t load:', l.reason.message);
  const list = c.status === 'fulfilled' ? c.value.filter(x => x.slug && x.name) : [];
  if (list.length) return [list, logos];
  dataNotice = c.status === 'rejected' ? c.reason.message : 'The Campuses tab came back empty. Check CAMPUS_GID.';
  console.warn('Using saved campus data:', dataNotice);
  return [SAMPLE_CAMPUSES, logos];
}

function logoPath(slug, type, variant, ext) {

/* ---------- Logo files ----------
   images/logos/manifest.js (written by the logo renamer) lists every logo file in the
   library. When it's present, each campus page shows exactly the files that exist,
   including extra sets like magnet or athletics logos. The Logos tab only overrides
   titles, descriptions, and group names. Without the manifest, pages fall back to the
   Logos tab or the standard three logos. */
const MANIFEST = window.LOGO_FILES || null;
// Custom labels from the renamer, with your capitalization (e.g. "STEAM seal")
const LABELS = Object.assign({ names: {}, sets: {}, variants: {} }, window.LOGO_LABELS || {});
const variantLabel = v => LABELS.variants[v] || LABELS.names[v] || VARIANT_LABELS[v] || humanize(v);
const SET_TITLES = { magnet: 'Magnet program', athletics: 'Athletics', band: 'Band' };
const SET_ORDER = ['campus', 'magnet', 'athletics', 'band'];
const TYPE_ORDER = ['primary', 'horizontal', 'mascot'];
const VARIANT_ORDER = ['full-color', 'full-color-dark', 'one-color', 'black-white', 'white'];
const variantRank = v => ({ 'full-color': 0, 'full-color-dark': 1, 'one-color': 3, 'black-white': 4, white: 5 }[v] ?? 2);
const DEFAULT_DESC = Object.fromEntries(DEFAULT_LOGOS.map(l => [l.type, l.description]));
const DEFAULT_TITLE = { primary: 'Primary logo', horizontal: 'Horizontal logo', mascot: 'Mascot' };
const rank = (list, k) => { const i = list.indexOf(k); return i < 0 ? 99 : i; };
// White logos have no JPG: a white JPG is just a blank white rectangle
const formatsFor = v => v === 'white' ? ['png', 'ai'] : FORMATS;

function parseLogoFile(slug, name) {
  const m = name.toLowerCase().match(/^(.+)\.(png|jpg|ai)$/);
  if (!m || !m[1].startsWith(slug + '-')) return null;
  const rest = m[1].slice(slug.length + 1);
  // Known color versions (standard plus any you've added, like "3-color"); anything else ending in "-color" counts too
  const known = ['full-color-dark', 'full-color', 'one-color', 'black-white', 'white', ...Object.keys(LABELS.variants)].sort((x, y) => y.length - x.length);
  const variant = known.find(v => rest.endsWith('-' + v)) || (rest.match(/-([a-z0-9]+-color)$/) || [])[1] || rest.split('-').pop();
  let type = rest.slice(0, rest.length - variant.length - 1), set = 'campus';
  if (!type) return null;
  const knownSet = [...SET_ORDER.slice(1), ...Object.keys(LABELS.sets)].sort((x, y) => y.length - x.length).find(x => type.startsWith(x + '-'));
  const sm = type.match(/^(.+)-(primary|horizontal|mascot)$/);
  if (knownSet) { set = knownSet; type = type.slice(knownSet.length + 1); }
  else if (sm) { set = sm[1]; type = sm[2]; }
  return { set, type, file: set === 'campus' ? type : `${set}-${type}`, variant, fmt: m[2] };
}

// Returns [{ name, items: [{ file, title, description, preview, variants: [{ key, formats }] }] }]
function logoGroupsFor(c) {
  const rows = logoRows.filter(r => r.slug === c.slug);
  const rowFor = file => rows.find(r => r.type === file);
  if (MANIFEST) {
    const parsed = (MANIFEST[c.slug] || []).map(n => parseLogoFile(c.slug, n)).filter(p => p && formatsFor(p.variant).includes(p.fmt));
    const sets = {};
    parsed.forEach(p => { const t = ((sets[p.set] ||= {})[p.type] ||= { file: p.file, v: {} }); (t.v[p.variant] ||= new Set()).add(p.fmt); });
    return Object.keys(sets).sort((a, b) => rank(SET_ORDER, a) - rank(SET_ORDER, b) || a.localeCompare(b)).map(set => ({
      set, name: set === 'campus' ? 'Campus logos' : rows.find(r => r.group && r.type.startsWith(set + '-'))?.group || LABELS.sets[set] || SET_TITLES[set] || humanize(set),
      items: Object.keys(sets[set]).sort((a, b) => rank(TYPE_ORDER, a) - rank(TYPE_ORDER, b) || a.localeCompare(b)).map(type => {
        const { file, v } = sets[set][type], row = rowFor(file);
        const variants = Object.keys(v).sort((a, b) => variantRank(a) - variantRank(b) || a.localeCompare(b))
          .map(key => ({ key, formats: FORMATS.filter(f => v[key].has(f)) }));
        const png = [...variants.map(x => x.key).filter(x => x !== 'white'), 'white'].find(k => v[k]?.has('png'));
        return { slug: c.slug, file, title: row?.title || LABELS.names[type] || DEFAULT_TITLE[type] || humanize(type), description: row?.description || DEFAULT_DESC[type] || '',
          preview: png ? logoPath(c.slug, file, png, 'png') : null, previewDark: png === 'white', variants };
      })
    }));
  }
  const main = rows.filter(r => !r.group);
  const groups = [{ set: 'campus', name: 'Campus logos', items: toLogos(c, main.length ? main : DEFAULT_LOGOS) }];
  rows.filter(r => r.group).forEach(r => {
    let g = groups.find(x => x.name === r.group);
    if (!g) groups.push(g = { set: (r.type.match(/^(.+)-(primary|horizontal|mascot)$/) || [])[1] || r.group.toLowerCase(), name: r.group, items: [] });
    g.items.push(...toLogos(c, [r]));
  });
  return groups;
}
function toLogos(c, list) {
  return list.map(r => {
    const vs = (r.variants || '').split(',').map(v => v.trim()).filter(Boolean);
    return { slug: c.slug, file: r.type, title: r.title || DEFAULT_TITLE[r.type] || humanize(r.type), description: r.description || DEFAULT_DESC[r.type] || '',
      preview: logoPath(c.slug, r.type, 'full-color', 'png'),
      variants: (vs.length ? vs : DEFAULT_VARIANTS).map(key => ({ key, formats: formatsFor(key) })) };
  });
}
const mainLogo = c => logoGroupsFor(c)[0]?.items[0] || null;
function initials(name) {
  return name.split(/\s+/).filter(w => /^[A-Z]/.test(w)).slice(0, 2).map(w => w[0]).join('');

// Directory tile and page-header image that isn't a download option. The sheet's thumbnail column holds a file name

function logoImg(c, item, alt = '') {

    onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'initials',textContent:'${esc(initials(c.name))}'}))">`;
}
function hexToRgb(hex) {
  const m = (hex || '').replace('#', '').match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  return m ? m.slice(1).map(h => parseInt(h, 16)) : null;
}
function colors(c) {
  const out = [];
  for (let i = 1; i <= 6; i++) {
    const hex = c[`color${i}_hex`];
    if (!hex) continue;
    const norm = (hex.startsWith('#') ? hex : '#' + hex).toLowerCase();
    const rgb = hexToRgb(norm);
    out.push({ hex: norm, rgb: rgb ? rgb.join(', ') : '', pms: c[`color${i}_pms`] || '' });
  }
  return out;
}
function parseFont(str) {
  const weights = { thin: 100, extralight: 200, light: 300, regular: 400, medium: 500, semibold: 600, bold: 700, extrabold: 800, black: 900 };
  const parts = str.trim().split(/\s+/);
  const last = parts[parts.length - 1].toLowerCase().replace('-', '');
  if (weights[last] && parts.length > 1) return { family: parts.slice(0, -1).join(' '), weight: weights[last], label: str };
  return { family: str.trim(), weight: 400, label: str };
}
const loadedFonts = new Set();
function loadFont(f) {
  const id = `${f.family}:${f.weight}`;
  if (loadedFonts.has(id)) return;
  loadedFonts.add(id);
  const custom = CONFIG.CUSTOM_FONTS[f.family];
  if (custom) {
    if (custom.file) {
      const style = document.createElement('style');
      style.textContent = `@font-face { font-family: '${f.family}'; font-weight: ${f.weight}; src: url('${custom.file}'); font-display: swap; }`;
      document.head.appendChild(style);
    }
    return;
  }
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(f.family).replace(/%20/g, '+')}:wght@${f.weight}&display=swap`;
  document.head.appendChild(link);
}
// Google "edit" links become "make a copy" links so the master template stays untouched
// Google Slides/Docs links open the template preview, where staff see the deck and click
// "Use Template" to get their own copy. Links already ending in /template/preview are kept as is.
function previewLink(url) {
  if (!/docs\.google\.com\/(presentation|document|spreadsheets)\/d\//.test(url) || /\/template\/preview/.test(url)) return url;
  const m = url.match(/^(https:\/\/docs\.google\.com\/(?:presentation|document|spreadsheets)\/d\/[\w-]+)/);
  return m ? `${m[1]}/template/preview` : url;
}
// Google Drive / Docs / Slides files shared "Anyone with the link" have a public thumbnail
function driveThumb(url) {
  const m = (url || '').match(/\/d\/([\w-]{20,})/) || (url || '').match(/[?&]id=([\w-]{20,})/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w800` : null;
}
// Try each image source in order; show a plain placeholder if none load
function imgChain(sources, label) {
  const list = sources.filter(Boolean);
  if (!list.length) return `<div class="preview none">${esc(label)}</div>`;
  return `<div class="preview"><img src="${esc(list[0])}" alt="" loading="lazy"
    data-next="${esc(list.slice(1).join('|'))}" data-label="${esc(label)}" onerror="nextImg(this)"></div>`;
}
function nextImg(img) {
  const rest = img.dataset.next ? img.dataset.next.split('|') : [];
  if (rest.length) { img.dataset.next = rest.slice(1).join('|'); img.src = rest[0]; return; }
  const box = img.parentElement;
  box.classList.add('none'); box.textContent = img.dataset.label;
}

    : zipFiles(slug).length ? `<button class="btn" type="button" data-zip="${esc(slug)}" data-label="${esc(label)}">Download all logo files</button>` : '';
  return btn ? `<div class="all-logos">${btn}<span class="muted">Every version and file type</span></div>` : '';
}
async function downloadAll(btn) {
  const slug = btn.dataset.zip, label = btn.dataset.label, names = zipFiles(slug);
  if (location.protocol === 'file:') return toast('Download all works on the live site, or when previewing with the local server.');
  if (!window.JSZip) return toast('Couldn’t build the download. Check your internet connection and try again.');
  const original = btn.textContent;
  btn.disabled = true;
  try {
    const zip = new JSZip();
    const multi = new Set(names.map(n => parseLogoFile(slug, n)?.set)).size > 1;
    for (let i = 0; i < names.length; i++) {
      btn.textContent = `Gathering ${i + 1} of ${names.length}…`;
      const res = await fetch(`${CONFIG.LOGO_BASE}${slug}/${names[i]}`);
      if (!res.ok) continue;
      const p = parseLogoFile(slug, names[i]);
      const folder = multi && p ? (p.set === 'campus' ? 'Campus logos' : LABELS.sets[p.set] || SET_TITLES[p.set] || humanize(p.set)) + '/' : '';
      zip.file(`${label}/${folder}${names[i]}`, await res.blob());
    }
    btn.textContent = 'Zipping…';
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `${slug}-logos.zip` });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (err) {
    toast('The download didn’t finish. Please try again.');
    console.error(err);
  } finally {
    btn.textContent = original; btn.disabled = false;
  }
}
async function downloadAsIs(href) {
  try {
    const res = await fetch(href);
    if (!res.ok) throw new Error(res.status);
    const blob = new Blob([await res.blob()], { type: 'application/octet-stream' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: href.split('/').pop() });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch { location.href = href; }
}

  ].filter(Boolean);

    : 'Most of these fonts are free from Google Fonts. Request the others with the buttons.';
  return `${lead} If you can’t install fonts on your device, choose something with a similar look.`;
}
function fontButton(f, c) {
  const custom = CONFIG.CUSTOM_FONTS[f.family];
  if (!custom) return `<a class="btn ghost" href="https://fonts.google.com/specimen/${encodeURIComponent(f.family).replace(/%20/g, '+')}" target="_blank" rel="noopener">Get font</a>`;
  if (custom.url) return `<a class="btn ghost" href="${esc(custom.url)}" target="_blank" rel="noopener">Get font</a>`;
  return `<a class="btn ghost" href="${mailto(CONFIG.CONTACT_EMAIL, `Font request: ${f.label} (${c.name})`)}">Request font</a>`;
}
function dotColor(v, pal) {
  if (v === 'white') return '#fff';
  if (v === 'one-color' || v === 'black-white') return '#000';
  return pal[0]?.hex || '#999';
}
function codeBtn(k, v, compact = false) {

  return `<button class="code${compact ? ' compact' : ''}" type="button" data-k="${esc(k)}" data-v="${esc(v)}" title="Click to copy">

}

// Template cards. Built-in ones have default wording; the sheet's Templates tab can change it
// and add new kinds of templates. A new template "flyer" reads its link from the Campuses
// tab's "flyer_url" column and its preview from images/templates/<slug>-flyer.png.
const BUILTIN_TEMPLATES = {
  letterhead: { tool: 'PDF', title: 'Letterhead and envelope', description: 'Print-ready files you can send to Print Services.', button: 'Letterhead',
    note: 'Typing on printed letterhead? Set margins to top 2.625", bottom 1.125", left and right 1".' },
  slides: { tool: 'Google Slides', title: 'Slide deck', description: 'Preview the deck, then click “Use Template” to get your own copy. The original stays clean.', button: 'Preview template', note: '' },
  canva: { tool: 'Canva', title: 'Social media posts', description: 'Announcements, new hire welcomes, and celebration posts. A free Canva account is all you need.', button: 'Open in Canva', note: '' },
  newsletter: { tool: 'ParentSquare', title: 'Newsletter', description: 'A newsletter template in campus colors.', button: 'Open template', note: '' }
};
function templates(c) {
  const norm = v => (v || '').trim().toLowerCase();
  const everyone = key => tplRows.find(r => norm(r.template) === key && !norm(r.slug));
  const forCampus = key => tplRows.find(r => norm(r.template) === key && norm(r.slug) === c.slug);
  // Order follows the Templates tab; built-ins it doesn't list keep their usual place at the end
  const keys = [...new Set([...tplRows.filter(r => !norm(r.slug)).map(r => norm(r.template)), ...Object.keys(BUILTIN_TEMPLATES)])].filter(Boolean);
  const out = [];
  keys.forEach(key => {
    const base = BUILTIN_TEMPLATES[key] || { tool: '', title: humanize(key), description: '', button: 'Open template', note: '' };
    const w = { ...base };
    const g = everyone(key);
    if (g) {
      // A row for every campus sets the wording; a blank description or note means none
      w.title = g.title || base.title;
      w.description = g.description || '';
      w.button = g.button || base.button;
      w.note = g.note || '';
      if (g.source) w.tool = g.source;
    }
    const own = forCampus(key);
    if (own) ['title', 'description', 'button', 'note'].forEach(f => { if (own[f]) w[f] = own[f]; });
    if (own?.source) w.tool = own.source;

    const value = key === 'letterhead' ? (c.letterhead_url || c.envelope_url) : c[`${key}_url`];
    if (!value) return;
    const open = url => url && /^https?:/.test(url) ? previewLink(url) : url;
    const actions = key === 'letterhead'
      ? [[w.button, c.letterhead_url, true], ['Envelope', c.envelope_url]]
      : [[w.button, open(value), true]];
    const live = actions.filter(a => isLink(a[1]));
    const tool = w.tool ? `<div class="tool">${esc(w.tool)}</div>` : '';
    if (!isLink(value) && !live.length) {
      out.push(`<div class="tpl soon"><div class="body">${tool}<h3>${esc(w.title)}</h3><p>${esc(value)}</p></div></div>`);
      return;
    }
    const preview = imgChain([
      `${CONFIG.TEMPLATE_PREVIEW_BASE}${c.slug}-${key}.png`,   // 1. an image you uploaded (PNG or JPG)
      `${CONFIG.TEMPLATE_PREVIEW_BASE}${c.slug}-${key}.jpg`,
      driveThumb(value)                                        // 2. automatic Google Drive thumbnail
    ], w.tool || w.title);
    out.push(`<div class="tpl">${preview}<div class="body">${tool}<h3>${esc(w.title)}</h3>${w.description ? `<p>${esc(w.description)}</p>` : ''}${w.note ? `<div class="margins">${esc(w.note)}</div>` : ''}
      <div class="actions">${live.map(([label, url, primary]) =>
        `<a class="btn ${primary ? '' : 'ghost'}" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`).join('')}</div></div></div>`);
  });
  return out;
}

/* =========================================================
   ROUTER
   #              → homepage
   #directory     → homepage, scrolled to the directory
   #dover         → Dover campus page
   #dover/colors  → Dover campus page, scrolled to colors
   ========================================================= */
const HOME_ANCHORS = ['directory', 'guidelines', 'filetypes'];
function route() {
  const [slug, sub] = decodeURIComponent(location.hash.slice(1)).split('/');
  const campus = campuses.find(c => c.slug === slug);
  if (campus) {
    renderCampus(campus);
    sub ? document.getElementById(sub)?.scrollIntoView() : window.scrollTo(0, 0);
    return;
  }
  if (!$('#directory')) renderHome();
  if (HOME_ANCHORS.includes(slug)) document.getElementById(slug)?.scrollIntoView();
  else window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  // AI files: some servers label them as PostScript, and Safari then renames them "….ai.ps".
  // Downloading them as plain data keeps the name exactly as it is.
  const aiLink = e.target.closest('a.fmt[href$=".ai"]');
  if (aiLink && location.protocol !== 'file:') { e.preventDefault(); downloadAsIs(aiLink.getAttribute('href')); return; }
  const zipBtn = e.target.closest('button[data-zip]');
  if (zipBtn) { downloadAll(zipBtn); return; }
  const code = e.target.closest('button.code');
  if (code) { copyText(code.dataset.v, code.dataset.k); return; }
  const a = e.target.closest('a');
  if (!a) return;
  if (a.hasAttribute('data-contact')) { a.href = mailto(CONFIG.CONTACT_EMAIL, 'Campus branding question'); return; }
  if (a.getAttribute('href') === '#sample') { e.preventDefault(); toast('Sample link. Add the real URL in the sheet.'); return; }
});
window.addEventListener('hashchange', route);

(async () => {
  try {
    [campuses, logoRows] = await loadData();
  } catch (err) {
    [campuses, logoRows] = [SAMPLE_CAMPUSES, []];
    dataNotice = err.message;
  }
  if (dataNotice) {
    document.body.insertAdjacentHTML('afterbegin', `<div class="data-notice" role="status">
      <strong>Showing saved campus data.</strong> The Google Sheet didn’t load, so recent sheet edits may be missing. ${esc(dataNotice)}</div>`);
  }
  try {
    route();
  } catch (err) {
    $('#app').innerHTML = `<div class="wrap loading">
      <p><strong>Something went wrong showing this page.</strong></p>
      <p style="margin-top:8px">Details: ${esc(err.message)}</p></div>`;
    console.error(err);
  }
})();
</script>
